<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kirish Sahifasi</title>
    <link rel="stylesheet" href="mashq.css" />
  </head>
  <body>
    <div class="login-container">
      <h1 class="main-title">KIRISH</h1>

      <div class="glass-card">
        <form>
          <div class="input-group">
            <label>Telefon raqami</label>
            <input type="text" placeholder="+998 90 123 45 67" />
          </div>

          <div class="input-group">
            <label>Parol</label>
            <input type="password" value="12345678" placeholder="••••••••" />
          </div>

          <div class="flex-row">
            <div class="checkbox-group">
              <input type="checkbox" id="remember" />
              <label for="remember">Eslab qolish</label>
            </div>
            <a href="#" class="forgot-link">Parolni tiklash</a>
          </div>

          <div class="button-group">
            <button type="submit" class="btn-login">Tizimga kirish</button>
            <button type="button" class="btn-back">Orqaga qaytish</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
